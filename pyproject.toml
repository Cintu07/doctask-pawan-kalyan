[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analyst"
version = "0.1.0"
description = "An agentic system that reads a pile of contract documents, builds a cited register, checks it against a playbook, and keeps it current."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=1.2",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "scikit-learn>=1.5",
]

[project.scripts]
analyst = "analyst.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
